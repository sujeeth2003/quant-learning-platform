<script>
const FPGA_UNITS=[
{title:"What is an FPGA — and why trading?",badge:"Foundation",badgeC:"#534AB7",badgeBg:"#EEEDFE",
concept:`An FPGA (Field-Programmable Gate Array) is a chip full of logic blocks you can wire together however you want — in software, after manufacture. Unlike a CPU which runs instructions one at a time, an FPGA runs everything in parallel simultaneously. Every wire, every gate, every computation happens at the same clock tick.

In trading: a CPU parsing a market data message takes ~1000 nanoseconds. The same parser in an FPGA takes ~50 nanoseconds. At HFT firms, the FPGA is placed directly on the network card so market data is parsed before it even reaches the CPU.`,
analogy:"Think of a CPU as one brilliant chef who does every task sequentially. An FPGA is a thousand workers each doing one tiny job simultaneously — slower per worker, but the pipeline produces results far faster.",
code:`// FPGA mental model — things happen IN PARALLEL
// These three assignments all execute at the same clock edge:
always @(posedge clk) begin
  reg_a <= input_a + input_b;   // adder fires
  reg_b <= input_c & input_d;   // AND gate fires  
  reg_c <= ~input_e;            // inverter fires
end
// All three complete in ONE clock cycle simultaneously`,
task:{title:"Task 1 — Install Vivado and simulate a 1-bit adder",steps:["Download Xilinx Vivado (free WebPACK edition) from xilinx.com","Create a new project, choose any Artix-7 device (xc7a35t)","Create a new Verilog file: module adder(input a, input b, output sum); assign sum = a ^ b; endmodule","Create a testbench: apply all four input combinations (00,01,10,11) and check outputs","Run behavioral simulation — you should see sum=0 for same inputs, sum=1 for different"],confirm:"Ask me to explain any step you get stuck on, or ask me to write the testbench for you"},
portfolio:"Can write and simulate basic Verilog in Vivado. Understands parallel execution model."},

{title:"Verilog syntax: wires, registers, always blocks",badge:"Core syntax",badgeC:"#0F6E56",badgeBg:"#E1F5EE",
concept:`Two types of signals: wire (combinational — like a physical wire, value is whatever drives it right now) and reg (sequential — holds its value until the next clock edge updates it). The always @(posedge clk) block is where sequential logic lives. It fires on every rising clock edge and updates registers.`,
analogy:"A wire is like a live display showing whatever is happening right now. A reg is like a notebook — you write a new value in it each clock tick, and it holds that value until you write again.",
code:`module demo(
  input  wire       clk,
  input  wire [7:0] data_in,   // 8-bit input
  output reg  [7:0] data_out   // 8-bit register
);
  wire [7:0] doubled;
  assign doubled = data_in << 1;  // combinational: shift left = *2

  always @(posedge clk) begin     // sequential: runs each clock tick
    data_out <= doubled;          // <= is non-blocking assignment
  end
endmodule`,
task:{title:"Task 2 — Build a 4-bit counter",steps:["Create module counter(input clk, input rst, output reg [3:0] count)","In always @(posedge clk): if rst, set count to 0; else increment count","Write testbench: apply clock for 20 cycles, assert rst for first 2","Watch count go 0,0,1,2,3,...,15,0,1,... — it wraps at 15 (4 bits)","Try: make it count DOWN when a 'direction' input is 0"],confirm:"Show me your counter code and I will review it exactly as a quant firm engineer would"},
portfolio:"Knows wire/reg distinction, always blocks, non-blocking assignment — core interview question at every HFT firm."},

{title:"Finite State Machines — the ITCH parser heart",badge:"Key pattern",badgeC:"#993C1D",badgeBg:"#FAECE7",
concept:`An FSM describes a system that is always in one of a finite set of states. On each clock edge, it checks the current state and the current input, then decides: stay in this state or move to another. EVERY protocol parser you will ever write in Verilog is an FSM. NASDAQ ITCH messages arrive as a stream of bytes — your FSM reads one byte per clock cycle and transitions through states until the full message is decoded.`,
analogy:"A vending machine is an FSM. States: IDLE, COIN_INSERTED, DISPENSING. Input: coin, button press. It transitions based on what happened. Your ITCH parser is the same — states: IDLE, READING_TYPE, READING_FIELDS, OUTPUT_VALID.",
code:`module simple_fsm(
  input  wire clk, rst,
  input  wire [7:0] rx_byte,
  input  wire byte_valid,
  output reg  msg_ready
);
  localparam IDLE  = 2'b00;
  localparam TYPE  = 2'b01;
  localparam FIELD = 2'b10;
  localparam DONE  = 2'b11;
  
  reg [1:0] state;
  reg [2:0] cnt;
  
  always @(posedge clk) begin
    if (rst) begin state <= IDLE; msg_ready <= 0; end
    else case (state)
      IDLE:  if (byte_valid) begin state <= TYPE; end
      TYPE:  begin
               cnt <= 0;
               state <= (rx_byte == 8'h41) ? FIELD : IDLE; // 0x41='A'
             end
      FIELD: begin
               cnt <= cnt + 1;
               if (cnt == 3'd7) state <= DONE;  // 8 field bytes
             end
      DONE:  begin msg_ready <= 1; state <= IDLE; end
    endcase
  end
endmodule`,
task:{title:"Task 3 — FSM for a 2-byte sequence detector",steps:["Build an FSM that detects the sequence 0xAB followed by 0xCD in a byte stream","States: IDLE, GOT_AB, FOUND","Output 'detected' goes high for one cycle when sequence is found","Test: send 0x00, 0xAB, 0xCD — detected should pulse","Test: send 0xAB, 0xAB, 0xCD — should still detect (second AB resets to GOT_AB)","This is exactly the pattern used to detect ITCH message start-of-frame"],confirm:"This is a classic FPGA interview question. Once you have it, ask me to walk through the full ITCH 5.0 FSM"},
portfolio:"Can design and implement FSMs — the primary pattern for all protocol parsers. Demonstrated with a byte-sequence detector."},

{title:"Pipelining — one result every clock cycle",badge:"Performance",badgeC:"#534AB7",badgeBg:"#EEEDFE",
concept:`Pipelining is how FPGAs achieve high throughput. Instead of waiting for a long computation to finish before starting the next one, you break it into stages. Each stage takes one clock cycle. After a latency of N cycles (to fill the pipe), you get one result per cycle regardless of how many stages there are. Trading example: ITCH decode → book update → signal compute → risk check. Each is a pipeline stage. New market data enters every cycle.`,
analogy:"A car assembly line. Each station does one job. After the line is full, one finished car comes out every minute even though building a whole car takes 60 minutes.",
code:`// 3-stage pipeline: multiply → add → compare
module pipeline(input clk, input [15:0] a, b, c, output reg alert);
  // Stage 1 registers
  reg [31:0] stage1_product;
  // Stage 2 registers  
  reg [31:0] stage2_sum;
  // Stage 3 registers (output)
  
  always @(posedge clk) begin
    // Stage 1: multiply (cycle N)
    stage1_product <= a * b;
    
    // Stage 2: add (cycle N+1) — uses stage 1 result
    stage2_sum <= stage1_product + c;
    
    // Stage 3: compare (cycle N+2) — uses stage 2 result
    alert <= (stage2_sum > 32'h0000FFFF);
  end
  // Latency: 3 cycles. Throughput: 1 result/cycle after pipe is full
endmodule`,
task:{title:"Task 4 — Pipeline a moving sum",steps:["Build a 4-stage pipeline that computes sum of last 4 prices","Stage 1: register incoming price, Stage 2: add prev two, Stage 3: add to running total, Stage 4: output","Testbench: feed prices 10,20,30,40,50,60 and verify output","You should see: after 4 cycles of latency, output = 10+20+30+40=100, then 20+30+40+50=140, etc.","This is the hardware moving-average — used directly in EMA computation on the order book"],confirm:"Show me your pipeline code. Then ask me to show how to convert this into a hardware EMA"},
portfolio:"Understands and implements pipelined datapath — the key technique for high-throughput signal computation in FPGA trading systems."},

{title:"Fixed-point arithmetic — no floats in hardware",badge:"Critical",badgeC:"#993C1D",badgeBg:"#FAECE7",
concept:`Floating point (like 3.14) requires large, slow hardware units. FPGAs in trading use fixed-point: represent 0.1 as the integer 1638 with an implicit denominator of 16384 (2^14). This is called Q14 format. All arithmetic is integer arithmetic — fast and small. You just have to track where the decimal point is mentally. VWAP, EMA alpha, spread — all implemented in fixed-point in hardware.`,
analogy:"Instead of writing \$1.50, a bank internally stores 150 cents. All arithmetic is done in cents (integers). At display time they divide by 100. Fixed-point is the same idea — just powers of 2 instead of 10.",
code:`// Q14 fixed-point: 1 unit = 1/16384
// To represent alpha = 0.1: 0.1 * 16384 = 1638
// To represent (1-alpha) = 0.9: 0.9 * 16384 = 14746
