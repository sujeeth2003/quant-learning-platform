const FPGA_UNITS=[
{title:"What is an FPGA — and why trading?",badge:"Foundation",badgeC:"#534AB7",badgeBg:"#EEEDFE",
concept:`An FPGA (Field-Programmable Gate Array) is a chip full of logic blocks you can wire together however you want — in software, after manufacture. Unlike a CPU which runs instructions one at a time, an FPGA runs everything in parallel simultaneously. Every wire, every gate, every computation happens at the same clock tick.

In trading: a CPU parsing a market data message takes ~1000 nanoseconds. The same parser in an FPGA takes ~50 nanoseconds. At HFT firms, the FPGA is placed directly on the network card so market data is parsed before it even reaches the CPU.`,
analogy:"Think of a CPU as one brilliant chef who does every task sequentially. An FPGA is a thousand workers each doing one tiny job simultaneously — slower per worker, but the pipeline produces results far faster.",
code:`// FPGA mental model — things happen IN PARALLEL
// These three assignments all execute at the same clock edge:
always @(posedge clk) begin
  reg_a <= input_a + input_b;   // adder fires
  reg_b <= input_c & input_d;   // AND gate fires  
  reg_c <= ~input_e;            // inverter fires
end
// All three complete in ONE clock cycle simultaneously`,
task:{title:"Task 1 — Install Vivado and simulate a 1-bit adder",steps:["Download Xilinx Vivado (free WebPACK edition) from xilinx.com","Create a new project, choose any Artix-7 device (xc7a35t)","Create a new Verilog file: module adder(input a, input b, output sum); assign sum = a ^ b; endmodule","Create a testbench: apply all four input combinations (00,01,10,11) and check outputs","Run behavioral simulation — you should see sum=0 for same inputs, sum=1 for different"],confirm:"Ask me to explain any step you get stuck on, or ask me to write the testbench for you"},
portfolio:"Can write and simulate basic Verilog in Vivado. Understands parallel execution model."},

{title:"Verilog syntax: wires, registers, always blocks",badge:"Core syntax",badgeC:"#0F6E56",badgeBg:"#E1F5EE",
concept:`Two types of signals: wire (combinational — like a physical wire, value is whatever drives it right now) and reg (sequential — holds its value until the next clock edge updates it). The always @(posedge clk) block is where sequential logic lives. It fires on every rising clock edge and updates registers.`,
analogy:"A wire is like a live display showing whatever is happening right now. A reg is like a notebook — you write a new value in it each clock tick, and it holds that value until you write again.",
code:`module demo(
  input  wire       clk,
  input  wire [7:0] data_in,   // 8-bit input
  output reg  [7:0] data_out   // 8-bit register
);
  wire [7:0] doubled;
  assign doubled = data_in << 1;  // combinational: shift left = *2

  always @(posedge clk) begin     // sequential: runs each clock tick
    data_out <= doubled;          // <= is non-blocking assignment
  end
endmodule`,
task:{title:"Task 2 — Build a 4-bit counter",steps:["Create module counter(input clk, input rst, output reg [3:0] count)","In always @(posedge clk): if rst, set count to 0; else increment count","Write testbench: apply clock for 20 cycles, assert rst for first 2","Watch count go 0,0,1,2,3,...,15,0,1,... — it wraps at 15 (4 bits)","Try: make it count DOWN when a 'direction' input is 0"],confirm:"Show me your counter code and I will review it exactly as a quant firm engineer would"},
portfolio:"Knows wire/reg distinction, always blocks, non-blocking assignment — core interview question at every HFT firm."},

{title:"Finite State Machines — the ITCH parser heart",badge:"Key pattern",badgeC:"#993C1D",badgeBg:"#FAECE7",
concept:`An FSM describes a system that is always in one of a finite set of states. On each clock edge, it checks the current state and the current input, then decides: stay in this state or move to another. EVERY protocol parser you will ever write in Verilog is an FSM. NASDAQ ITCH messages arrive as a stream of bytes — your FSM reads one byte per clock cycle and transitions through states until the full message is decoded.`,
analogy:"A vending machine is an FSM. States: IDLE, COIN_INSERTED, DISPENSING. Input: coin, button press. It transitions based on what happened. Your ITCH parser is the same — states: IDLE, READING_TYPE, READING_FIELDS, OUTPUT_VALID.",
code:`module simple_fsm(
  input  wire clk, rst,
  input  wire [7:0] rx_byte,
  input  wire byte_valid,
  output reg  msg_ready
);
  localparam IDLE  = 2'b00;
  localparam TYPE  = 2'b01;
  localparam FIELD = 2'b10;
  localparam DONE  = 2'b11;
  
  reg [1:0] state;
  reg [2:0] cnt;
  
  always @(posedge clk) begin
    if (rst) begin state <= IDLE; msg_ready <= 0; end
    else case (state)
      IDLE:  if (byte_valid) begin state <= TYPE; end
      TYPE:  begin
               cnt <= 0;
               state <= (rx_byte == 8'h41) ? FIELD : IDLE; // 0x41='A'
             end
      FIELD: begin
               cnt <= cnt + 1;
               if (cnt == 3'd7) state <= DONE;  // 8 field bytes
             end
      DONE:  begin msg_ready <= 1; state <= IDLE; end
    endcase
  end
endmodule`,
task:{title:"Task 3 — FSM for a 2-byte sequence detector",steps:["Build an FSM that detects the sequence 0xAB followed by 0xCD in a byte stream","States: IDLE, GOT_AB, FOUND","Output 'detected' goes high for one cycle when sequence is found","Test: send 0x00, 0xAB, 0xCD — detected should pulse","Test: send 0xAB, 0xAB, 0xCD — should still detect (second AB resets to GOT_AB)","This is exactly the pattern used to detect ITCH message start-of-frame"],confirm:"This is a classic FPGA interview question. Once you have it, ask me to walk through the full ITCH 5.0 FSM"},
portfolio:"Can design and implement FSMs — the primary pattern for all protocol parsers. Demonstrated with a byte-sequence detector."},

{title:"Pipelining — one result every clock cycle",badge:"Performance",badgeC:"#534AB7",badgeBg:"#EEEDFE",
concept:`Pipelining is how FPGAs achieve high throughput. Instead of waiting for a long computation to finish before starting the next one, you break it into stages. Each stage takes one clock cycle. After a latency of N cycles (to fill the pipe), you get one result per cycle regardless of how many stages there are. Trading example: ITCH decode → book update → signal compute → risk check. Each is a pipeline stage. New market data enters every cycle.`,
analogy:"A car assembly line. Each station does one job. After the line is full, one finished car comes out every minute even though building a whole car takes 60 minutes.",
code:`// 3-stage pipeline: multiply → add → compare
module pipeline(input clk, input [15:0] a, b, c, output reg alert);
  // Stage 1 registers
  reg [31:0] stage1_product;
  // Stage 2 registers  
  reg [31:0] stage2_sum;
  // Stage 3 registers (output)
  
  always @(posedge clk) begin
    // Stage 1: multiply (cycle N)
    stage1_product <= a * b;
    
    // Stage 2: add (cycle N+1) — uses stage 1 result
    stage2_sum <= stage1_product + c;
    
    // Stage 3: compare (cycle N+2) — uses stage 2 result
    alert <= (stage2_sum > 32'h0000FFFF);
  end
  // Latency: 3 cycles. Throughput: 1 result/cycle after pipe is full
endmodule`,
task:{title:"Task 4 — Pipeline a moving sum",steps:["Build a 4-stage pipeline that computes sum of last 4 prices","Stage 1: register incoming price, Stage 2: add prev two, Stage 3: add to running total, Stage 4: output","Testbench: feed prices 10,20,30,40,50,60 and verify output","You should see: after 4 cycles of latency, output = 10+20+30+40=100, then 20+30+40+50=140, etc.","This is the hardware moving-average — used directly in EMA computation on the order book"],confirm:"Show me your pipeline code. Then ask me to show how to convert this into a hardware EMA"},
portfolio:"Understands and implements pipelined datapath — the key technique for high-throughput signal computation in FPGA trading systems."},

{title:"Fixed-point arithmetic — no floats in hardware",badge:"Critical",badgeC:"#993C1D",badgeBg:"#FAECE7",
concept:`Floating point (like 3.14) requires large, slow hardware units. FPGAs in trading use fixed-point: represent 0.1 as the integer 1638 with an implicit denominator of 16384 (2^14). This is called Q14 format. All arithmetic is integer arithmetic — fast and small. You just have to track where the decimal point is mentally. VWAP, EMA alpha, spread — all implemented in fixed-point in hardware.`,
analogy:"Instead of writing \$1.50, a bank internally stores 150 cents. All arithmetic is done in cents (integers). At display time they divide by 100. Fixed-point is the same idea — just powers of 2 instead of 10.",
code:`// Q14 fixed-point: 1 unit = 1/16384
// To represent alpha = 0.1: 0.1 * 16384 = 1638
// To represent (1-alpha) = 0.9: 0.9 * 16384 = 14746

module ema_fixed(
  input  wire        clk,
  input  wire [15:0] price_in,    // price in ticks (integer)
  output reg  [15:0] ema_out      // EMA in ticks
);
  localparam [15:0] ALPHA     = 16'd1638;   // 0.1 in Q14
  localparam [15:0] ONE_ALPHA = 16'd14746;  // 0.9 in Q14
  
  always @(posedge clk) begin
    // EMA = alpha*price + (1-alpha)*prev_ema
    // Multiply gives Q28, shift right 14 to get back to Q14
    ema_out <= ((ALPHA * price_in) + (ONE_ALPHA * ema_out)) >> 14;
  end
endmodule`,
sim:{label:"Fixed-point EMA simulator",desc:"See how the hardware EMA tracks prices"},
task:{title:"Task 5 — Implement hardware VWAP in fixed-point",steps:["VWAP = sum(price * volume) / sum(volume) over N trades","In Verilog: accumulate price*qty (Q14) and qty separately","After N=8 trades, output the ratio","Test with prices [100,102,101,103] and volumes [10,5,20,15]","Expected VWAP: (100*10 + 102*5 + 101*20 + 103*15) / (10+5+20+15) = 101.56 ticks","This is one of the most common interview problems at quant firms with FPGA roles"],confirm:"Walk me through building a hardware VWAP module — I want to see the full Verilog"},
portfolio:"Can implement fixed-point arithmetic for financial signals. Coded EMA and VWAP in Verilog."},

{title:"AXI4-Stream — connecting your modules",badge:"Interface",badgeC:"#0F6E56",badgeBg:"#E1F5EE",
concept:`AXI4-Stream is the standard handshake interface used to connect FPGA modules. Three key signals: TVALID (source has data), TREADY (sink can accept data), TDATA (the actual data). A transfer happens only when BOTH valid and ready are high at the clock edge. Your ITCH parser produces AXI4-Stream. Your order book consumes it. Your signal module consumes the book output. This is the plumbing connecting your entire trading pipeline.`,
analogy:"TVALID is the delivery driver arriving at your door. TREADY is you being home to accept it. The package (TDATA) only changes hands when both are true at the same moment.",
code:`// AXI4-Stream handshake
module axis_example(
  input  wire        clk,
  // Input stream (from ITCH parser)
  input  wire        s_tvalid,
  output wire        s_tready,
  input  wire [63:0] s_tdata,   // decoded order book event
  // Output stream (to signal engine)
  output reg         m_tvalid,
  input  wire        m_tready,
  output reg  [31:0] m_tdata    // computed signal
);
  reg busy;
  assign s_tready = ~busy;  // accept when not busy
  
  always @(posedge clk) begin
    if (s_tvalid && s_tready) begin  // handshake occurred
      busy     <= 1;
      m_tdata  <= s_tdata[31:0] - s_tdata[63:32]; // bid-ask spread
      m_tvalid <= 1;
    end
    if (m_tvalid && m_tready) begin  // downstream consumed result
      busy     <= 0;
      m_tvalid <= 0;
    end
  end
endmodule`,
task:{title:"Task 6 — Connect ITCH parser to order book via AXI4-Stream",steps:["Create a top-level module with three sub-modules: itch_parser, order_book, signal_engine","Connect them with AXI4-Stream buses","The parser outputs: order_id, price, qty, side, msg_type","The book consumes this and outputs: best_bid, best_ask, bid_qty, ask_qty","The signal engine computes spread and OFI from the book outputs","Simulate: inject 5 ITCH bytes into the top level, verify signal outputs"],confirm:"This is your complete trading pipeline. Ask me to review your top-level integration"},
portfolio:"Can design and connect modular FPGA pipelines using AXI4-Stream. Built a complete market-data-to-signal pipeline."}
];

const KDB_UNITS=[
{title:"What is KDB+ and why does every quant firm use it?",badge:"Foundation",badgeC:"#185FA5",badgeBg:"#E6F1FB",
concept:`KDB+ is a column-oriented in-memory database. Unlike row-oriented databases (MySQL, Postgres), KDB+ stores each column as a contiguous block in memory. For time series data — where you almost always want "give me all prices for this symbol over this time range" — this is dramatically faster. A table with 100 million rows takes seconds to query in KDB+, minutes in Postgres. Every major bank and HFT firm runs KDB+ for tick data storage and real-time analytics.`,
analogy:"A row database is like a filing cabinet — each drawer is one record (person). To find everyone's age, you open every drawer. A column database is like a spreadsheet — the 'age' column is one contiguous strip. You read just that strip.",
code:`/ Q language — KDB+ query language
/ Start q: just type q in terminal after installing
/ Everything in Q operates on vectors (lists) automatically

/ Create a simple table of trades
trades: ([] time:09:30:00 09:31:00 09:32:00;
           sym: \`AAPL\`AAPL\`AAPL;
           price: 150.1 150.3 150.2;
           qty: 100 200 150)

/ Query it — SQL-like syntax
select from trades where sym=\`AAPL
select avg price from trades
select sum qty by sym from trades`,
task:{title:"Task 1 — Install KDB+ and query your first table",steps:["Download free 32-bit KDB+ from kx.com (personal use license)","Run: ./q in terminal — you get the q) prompt","Type: t:([] a:1 2 3; b:10 20 30) to create a table","Type: select from t to see it","Type: select a+b from t — notice it computed a+b for every row automatically","Type: select sum b by a from t — group and aggregate","Try: select avg b from t where a > 1"],confirm:"Show me any errors you hit — KDB+ setup trips everyone up the first time"},
portfolio:"KDB+ installed and running. Can create tables and run basic qSQL queries."},

{title:"Q is an array language — think in vectors, never loops",badge:"Core concept",badgeC:"#0F6E56",badgeBg:"#E1F5EE",
concept:`In Python you write loops. In Q, you never write loops. Every operation on a list automatically applies to every element — this is called implicit iteration. If you catch yourself writing a loop in Q, you are doing it wrong. This is why Q is so fast — the implicit iteration compiles to tight SIMD-style vector operations over contiguous memory. The single most important mental shift in learning Q.`,
analogy:"In Python: for price in prices: total += price. In Q: sum prices. Same result, Q version is 100x faster on a million prices because it never leaves the vector engine.",
code:`/ Q vector operations — NO loops needed
prices: 150.1 150.3 149.8 150.5 150.2

/ All these operate on the ENTIRE list at once:
prices * 2           / 300.2 300.6 299.6 301.0 300.4
prices - avg prices  / demeaned prices
prices > 150.0       / boolean mask: 1 1 0 1 1
sum prices > 150.0   / count prices above 150: 4

/ Adverbs — Q's way of applying functions
+/ 1 2 3 4 5         / over: running fold = 15 (sum)
+\ 1 2 3 4 5         / scan: running totals = 1 3 6 10 15
1 +': 10 20 30       / each-prior: differences from previous

/ This replaces ALL your loops:
deltas prices        / differences: each price minus previous
ratios prices        / ratios: each price / previous (returns)`,
sim:{label:"Vector operations live demo"},
task:{title:"Task 2 — Compute returns and rolling stats without any loops",steps:["In q: prices: 100 102 101 105 103 107 109","Compute log returns: log ratios prices — this gives ln(p_t/p_{t-1})","Compute 3-period moving average: 3 mavg prices — built-in","Compute 3-period moving std dev: 3 mdev prices","Find the index of the max price: prices?max prices","Count prices above the moving average: sum prices > 3 mavg prices","None of these use a loop — verify that you can do all 6 in one line each"],confirm:"Once you have these working, ask me to explain adverbs — they are the hardest concept in Q and the one quant interviewers test most"},
portfolio:"Fluent in Q vector operations. Can compute returns, moving stats, and boolean filters without loops."},

{title:"Tables, keyed tables, and qSQL",badge:"Data model",badgeC:"#185FA5",badgeBg:"#E6F1FB",
concept:`A Q table is a collection of equal-length columns, where each column is a list. A keyed table is a table where one or more columns are the primary key — like a dictionary mapping key rows to value rows. qSQL looks like SQL but operates on in-memory columnar data and supports time-series-specific operations that SQL cannot. The by clause creates a grouped result. Where can use any Q expression, not just simple comparisons.`,
analogy:"A regular table is like a spreadsheet. A keyed table is like a spreadsheet with an index column that lets you do O(1) lookup by key — like a Python dict but where each value is a whole row.",
code:`/ Create trade and quote tables
trades:([] time:asc 09:30:00+til 10; sym:10#\`AAPL;
         price:150+10?2.0; qty:100*1+10?5)
quotes:([] time:asc 09:30:00+til 20; sym:20#\`AAPL;
         bid:149.9+20?0.2; ask:150.1+20?0.2)

/ qSQL — richer than SQL
select time,price,qty from trades where qty>200
select vwap:wavg[qty;price] by sym from trades
select max price, min price, last price by sym from trades

/ As-of join — THE most important KDB operation
/ For each trade, get the last quote before that trade time:
aj[\`sym\`time; trades; quotes]
/ Result: trades table with bid/ask columns added
/ This is how you analyze trade quality — was it at bid or ask?`,
task:{title:"Task 3 — Build a quote-to-trade join and compute effective spread",steps:["Create trades and quotes tables as shown above","Run the aj join to attach quotes to trades","Add a column: side: ?[price>ask;\"buy\";\"sell\"] — direction of each trade","Compute effective spread: 2 * abs(price - (bid+ask)%2) for each trade","Compute average effective spread: avg select eff_spread from ... ","Group by hour: select avg eff_spread by 1 xbar time.minute from result","This is real market microstructure research — the kind done daily at HFT firms"],confirm:"Show me your join code — I will walk through exactly what aj is doing and how to debug it"},
portfolio:"Can perform as-of joins to align trade and quote data. Computed effective spread — a real market microstructure metric."},

{title:"KDB algorithms: VWAP, TWAP, RSI, Bollinger, MACD",badge:"Algorithms",badgeC:"#534AB7",badgeBg:"#EEEDFE",
concept:`These algorithms exist in Q as one-line or two-line implementations. Understanding them means knowing: (1) the formula, (2) why it was invented, (3) what it signals, (4) the Q code. Every one of these comes up in quant firm interviews. Knowing the history shows you genuinely understand — not just memorized syntax.`,
analogy:"A chef who only knows recipes but not why ingredients work together will fail when asked to adapt. Know the formula AND the intuition.",
code:`/ VWAP — Volume Weighted Average Price (1980s institutional benchmark)
/ "What was the average price, weighted by how much traded at each price?"
/ Used to evaluate execution quality: did you beat VWAP?
vwap: {wavg[x\`qty; x\`price]}  / x is a trade table partition
select vwap:wavg[qty;price] by sym from trades

/ TWAP — Time Weighted Average Price
/ "What was the average price across equal time buckets?"
twap:{avg select last price by 1 xbar time.second from x}

/ RSI — Relative Strength Index (Wilder, 1978)
/ "How overbought/oversold is this asset?" Range 0-100
/ Above 70: overbought. Below 30: oversold.
rsi:{[n;p]
  d: deltas p;               / price changes
  u: 0.0^d*d>0;             / up-moves (0 where negative)
  d2: 0.0^neg d*d<0;        / down-moves (0 where positive)
  100 - 100%1+((n mavg u)%n mavg d2)}

/ Bollinger Bands (John Bollinger, 1983)
/ "How far is price from its mean in units of standard deviation?"
bbands:{[n;p] (n mavg p)+/:\: 0 2 -2 * n mdev p}

/ MACD (Gerald Appel, 1979)
/ "Is the short-term trend faster or slower than the long-term trend?"
macd:{[p]
  fast: 12 ema p;    / 12-period EMA (short-term momentum)
  slow: 26 ema p;    / 26-period EMA (long-term trend)
  line: fast - slow; / positive = uptrend accelerating
  signal: 9 ema line; / smoothed MACD
  (line; signal; line-signal)}  / macd, signal, histogram`,
task:{title:"Task 4 — Build a signal dashboard in Q",steps:["Generate 100 prices: prices: 100+sums -1+200?0.01","Compute: RSI(14), Bollinger(20), MACD — in Q as shown","Create a table: ([] price:prices; rsi:rsi[14;prices]; upper:first bbands[20;prices]; lower:last bbands[20;prices])","Find all times price is below lower Bollinger and RSI<30 (double confirmation buy signal)","Count how many such signals occur: sum ?[...;...;0b;()]","Compute the 5-day forward return after each signal","This is a complete signal backtest — the core task in quant research"],confirm:"Ask me to explain why RSI was invented and what edge it has — understanding the origin is what separates a quant from a programmer"},

{title:"Tick plant architecture: tickerplant, RDB, HDB",badge:"Architecture",badgeC:"#0F6E56",badgeBg:"#E1F5EE",
concept:`The tick plant is the production architecture every trading firm uses. Tickerplant (TP): receives raw feed, timestamps it, and publishes to subscribers. Real-time database (RDB): subscribes to TP, holds all of today's data in memory. Historical database (HDB): at end of day, RDB data is saved to disk in a compressed columnar format. All components communicate via Q's IPC (inter-process communication) using handles. You can run this entire architecture on your laptop.`,
code:`/ tickerplant.q — receives and distributes data
/ Run this in one terminal: q tickerplant.q

/ rdb.q — subscribes and holds intraday data
/ Run this in another terminal: q rdb.q

/ Connecting processes together:
h: hopen \`:localhost:5010  / open handle to tickerplant
h (set;\`trades;...)        / push data to TP

/ Querying the RDB from your research process:
rdb: hopen \`:localhost:5011
rdb "select from trades where sym=\`AAPL"

/ At end of day: save to HDB
\`:hdb/2024.01.15/trades/ upsert trades
/ Load historical day:
hdb: hopen \`:localhost:5012
hdb "select from trades where date=2024.01.15, sym=\`AAPL"`,
task:{title:"Task 5 — Run a local tick plant and stream simulated data into it",steps:["Create tickerplant.q: starts a q process on port 5010, defines upd function","Create feedhandler.q: connects to TP, generates random OHLCV data every 100ms","Create rdb.q: subscribes to TP, accumulates data in memory","In three terminals, run all three processes","From a fourth terminal: query the RDB and watch data arrive in real time","Add a 4th process: a simple alert that prints when price moves >0.5% in 1 second","This is the exact architecture you would see at any bank or HFT fund"],confirm:"This is the most impressive portfolio piece you can build. Ask me for the complete tickerplant.q code to get started"},

{title:"Window join and time-series aggregation",badge:"Advanced",badgeC:"#993C1D",badgeBg:"#FAECE7",
concept:`wj (window join) is one of Q's most powerful operations. For each row in a table, it looks back (and optionally forward) a specified time window and computes aggregations. Example: for each trade, compute the sum of all volumes in the 1 second before that trade. This is how you compute features for ML models in tick data — order flow in a window, VWAP in a window, volatility in a window.`,
code:`/ Window join example
/ For each trade, get stats from quotes in the 500ms before it
/ Window: -500ms to 0ms relative to each trade time

wj[-500 0%\`second;
   \`sym\`time;
   trades;
   (quotes; (avg;\`bid); (avg;\`ask); (count;\`time))]
/ Result: each trade row gets avg_bid, avg_ask, quote_count
/ from the 500ms before that trade

/ Practical: compute order flow imbalance in 1s window
/ OFI = (buy_volume - sell_volume) / total_volume
ofi: {[w;t;q]
  res: wj[-w 0; \`sym\`time; t; (q; (sum;\`qty))];
  res}`,

portfolio:"Built a complete feature engineering pipeline using wj (window join). Produced an ML-ready dataset from tick data."}

function buildUnits(units, trackId) {
  const track = document.getElementById('track-'+trackId);
  units.forEach((u,i) => {
    const div = document.createElement('div');
    div.className = 'unit';
    div.innerHTML = `<div class="unit-head" onclick="toggleUnit(this)">
      <div class="unit-num" style="background:${u.badgeBg};color:${u.badgeC}">${i+1}</div>
      <div class="unit-title">${u.title}</div>
      <span class="unit-badge" style="background:${u.badgeBg};color:${u.badgeC}">${u.badge}</span>
      <i class="ti ti-chevron-down unit-arrow" aria-hidden="true"></i>
    </div>
    <div class="unit-body">
      <div class="concept">
        <div class="concept-label">Concept</div>
        <p>${u.concept}</p>
        <div class="analogy"><p><strong>Analogy:</strong> ${u.analogy}</p></div>
      </div>
      <pre>${u.code}</pre>
      <div class="task-box">
        <div class="task-label"><i class="ti ti-hammer" aria-hidden="true"></i> Hands-on task: ${u.task.title}</div>
        <ol class="task-steps">${u.task.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
        <p style="margin-top:6px;font-size:11px;color:#085041"><i class="ti ti-info-circle" aria-hidden="true" style="font-size:12px"></i> ${u.task.confirm}</p>
      </div>
      ${u.portfolio ? `<div class="portfolio"><div class="portfolio-label"><i class="ti ti-briefcase" aria-hidden="true"></i> Portfolio evidence</div><ul><li>${u.portfolio}</li></ul></div>` : ''}
      <button class="ask-btn" onclick="sendPrompt('I am working on: ${u.title.replace(/'/g,"\\'")} — help me through it step by step')"><i class="ti ti-arrow-up-right" aria-hidden="true"></i> Start this with Claude ↗</button>
    </div>`;
    track.appendChild(div);
  });
}
